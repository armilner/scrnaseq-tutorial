# Checks that a brand-new computer can install everything and run the beginner tutorial.
name: test-beginner

on:
  workflow_dispatch:
  push:
    paths: ["beginner/**", ".github/workflows/test-beginner.yml"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: beginner
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libhdf5-dev libglpk-dev libpng-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libtiff5-dev libjpeg-dev
      - name: Install packages (the same script a reader runs)
        run: Rscript install_packages.R
      - name: Check nothing is missing
        run: Rscript -e "p <- c('Seurat','harmony','msigdbr','muscData','celda','scDblFinder','scuttle','SingleR','celldex','DESeq2','fgsea'); m <- p[!sapply(p, requireNamespace, quietly = TRUE)]; if (length(m)) stop('missing: ', paste(m, collapse = ', '))"
      - name: Render the tutorial
        if: runner.os != 'macOS'   # the free Mac runner has only 7 GB of RAM
        run: quarto render tutorial_beginner.qmd
